version: "2.0"

screen:
  name: 검색
  route: /search
  layout: full-width
  auth: false

data_requirements:
  - resource: mentoring_sessions
    needs: [id, title, description, location, mentor_id, category_id]
    filters: { query: "?q" }

  - resource: categories
    needs: [id, name]

  - resource: users
    needs: [id, name, avatar_url, region]

components:
  - id: search_input
    type: search-form
    position: main
    function: 검색어 입력 (자동 포커스)
    events:
      - on: submit
        do: 검색 결과 표시
      - on: input
        do: 디바운스 후 자동 검색

  - id: recent_searches
    type: list
    position: main
    function: 최근 검색어 목록
    events:
      - on: click:item
        do: 해당 검색어로 검색

  - id: popular_searches
    type: list
    position: main
    function: 인기 검색어 목록
    events:
      - on: click:item
        do: 해당 검색어로 검색

  - id: search_results
    type: list
    position: main
    function: 검색 결과 멘토 카드 목록
    data_source:
      resource: mentoring_sessions
    events:
      - on: click:card
        do: /mentoring/:id로 이동

  - id: category_filter
    type: filter-form
    position: main
    function: 카테고리, 지역별 필터
    data_source:
      resource: categories
    events:
      - on: change
        do: 검색 결과 필터링

connections:
  navigations:
    - from: search_results
      to: /mentoring/:id

  shared_components:
    - tab_bar

tests:
  - name: 초기 상태
    when: /search 접속
    then: [검색 입력 자동 포커스, 최근 검색어 표시, 인기 검색어 표시]

  - name: 검색 실행
    when: "기타" 입력 후 검색
    then: [기타 관련 멘토링 결과 표시]

  - name: 결과 없음
    when: 존재하지 않는 키워드 검색
    then: [검색 결과 없음 안내 표시]
